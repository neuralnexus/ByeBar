name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ fromJSON(((((github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && vars.NEXUS_RUNS_ON_LINUX) || '["ubuntu-26.04"]')) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run validate

  browser-packages:
    needs: validate
    runs-on: ${{ fromJSON(((((github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && vars.NEXUS_RUNS_ON_UBUNTU_26_04_BROWSER) || '["ubuntu-26.04"]')) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run validate:packages
      - run: npx playwright install --with-deps chromium
      - name: Validate CRX packaging
        shell: bash
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/byebar-ci.pem"
          CHROME_PATH="$(node --input-type=module -e "import { chromium } from '@playwright/test'; process.stdout.write(chromium.executablePath())")" \
          BYEBAR_CRX_PRIVATE_KEY="$RUNNER_TEMP/byebar-ci.pem" \
          BYEBAR_CRX_NO_SANDBOX=1 \
          npm run build:store:crx
      - run: npm run test:e2e
        env:
          BYEBAR_EXTENSION_PATH: ${{ github.workspace }}/dist/stage/chrome
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: browser-packages
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-failures
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  safari:
    needs: validate
    runs-on: ${{ fromJSON(((((github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && vars.NEXUS_RUNS_ON_MACOS_15_ARM64_DEVELOPER) || '["macos-15"]')) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run validate:safari
