<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ByeBar</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="brand">
      <img class="logo" src="../icons/icon-48.png" width="40" height="40" alt="" />
      <h1>ByeBar</h1>
      <p class="tagline">Remove interruptions without breaking the page behind them.</p>
    </header>

    <main class="content">
      <p class="status" id="status" aria-live="polite"></p>

      <div class="scope" aria-label="Settings scope">
        <button type="button" id="scope-site" aria-pressed="true">This site</button>
        <button type="button" id="scope-global" aria-pressed="false">Global defaults</button>
      </div>

      <section class="settings" aria-label="ByeBar settings">
        <label class="row row--site">
          <span class="row-copy">
            <span class="row-title" id="enabled-label">Enabled on this site</span>
            <span class="row-host" id="host-label"></span>
            <span class="row-source" id="enabled-source"></span>
          </span>
          <input type="checkbox" id="site-enabled" data-setting="enabled" />
        </label>

        <label class="row">
          <span class="row-copy">
            <span class="row-title">Block promotional popups &amp; bars</span>
            <span class="row-source" id="generic-blocking-source"></span>
          </span>
          <input type="checkbox" id="generic-blocking" data-setting="genericBlocking" />
        </label>

        <label class="row">
          <span class="row-copy">
            <span class="row-title">Auto-decline cookie banners</span>
            <span class="row-source" id="cookie-decline-source"></span>
          </span>
          <input type="checkbox" id="cookie-decline" data-setting="cookieDecline" />
        </label>

        <label class="row">
          <span class="row-copy">
            <span class="row-title">Auto-accept legal dialogs</span>
            <span class="row-source" id="tos-accept-source"></span>
          </span>
          <input type="checkbox" id="tos-accept" data-setting="tosAccept" />
        </label>

        <button type="button" class="reset-button" id="reset-site" hidden>Use global defaults</button>
      </section>

      <section class="action-card" aria-labelledby="action-heading">
        <div>
          <h2 id="action-heading">Latest page action</h2>
          <p id="action-summary">No page action yet</p>
        </div>
        <button type="button" id="undo-action" disabled>Undo latest hide</button>
      </section>

      <details class="debug-panel">
        <summary>Local diagnostics</summary>
        <label class="debug-toggle">
          <span>
            <strong>Debug decisions</strong>
            <small>Preference stays on this device. Decisions clear on reload.</small>
          </span>
          <input type="checkbox" id="debug-enabled" />
        </label>
        <ol class="debug-list" id="debug-list"></ol>
        <button type="button" class="text-button" id="clear-debug" hidden>Clear page decisions</button>
      </details>

      <footer class="footer">
        <p class="privacy-note">Settings stay on this device. No telemetry.</p>
        <p class="footer-links">
          <a href="#" id="report-bug" target="_blank" rel="noopener noreferrer">Report a bug</a>
          <span aria-hidden="true">·</span>
          <a href="#" id="request-feature" target="_blank" rel="noopener noreferrer">Request a feature</a>
        </p>
        <p class="credit">
          Made by <a href="https://mattivan.com" target="_blank" rel="noopener noreferrer">Matt Ivan</a>
        </p>
      </footer>
    </main>

    <script src="../shared/runtime.generated.js"></script>
    <script src="../shared/browser.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
