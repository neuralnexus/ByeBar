<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="common.css" />
    <title>Manual picker</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
      }

      #protected-main {
        min-height: 560px;
        padding: 32px;
        background: #eef6f2;
      }

      #manual-interruption {
        position: fixed;
        right: 48px;
        bottom: 44px;
        width: 380px;
        min-height: 150px;
        padding: 24px;
        color: #fff;
        background: #174b47;
        border: 4px solid #ff7358;
        border-radius: 18px;
        box-shadow: 0 18px 50px rgb(0 0 0 / 24%);
      }

      #manual-control {
        padding: 10px 16px;
      }

      #fixture-frame {
        width: 260px;
        height: 100px;
        margin: 24px 32px;
        border: 3px solid #174b47;
      }

      dialog {
        padding: 28px;
      }
    </style>
  </head>
  <body>
    <main id="protected-main">
      <h1>Article workspace</h1>
      <p>The open area of this landmark must never become a picker target.</p>
    </main>

    <iframe
      id="fixture-frame"
      title="Embedded control"
      srcdoc="<!doctype html><button id='frame-control' onclick='window.clicks=(window.clicks||0)+1'>Frame action</button>"
    ></iframe>

    <aside id="manual-interruption">
      <h2>Need a hand?</h2>
      <p>Open a guided walkthrough for this page.</p>
      <button type="button" id="manual-control">Open walkthrough</button>
    </aside>

    <dialog id="native-modal">
      <p>Complete this native modal first.</p>
      <button type="button" id="close-native-modal">Close dialog</button>
    </dialog>

    <script>
      window.fixtureEvents = { actionClicks: 0, pageClicks: 0, keydowns: 0 };
      document.getElementById('manual-control').addEventListener('click', () => {
        window.fixtureEvents.actionClicks += 1;
      });
      document.addEventListener('click', () => {
        window.fixtureEvents.pageClicks += 1;
      });
      document.addEventListener('keydown', () => {
        window.fixtureEvents.keydowns += 1;
      });
      const nativeModal = document.getElementById('native-modal');
      document.getElementById('close-native-modal').addEventListener('click', () => nativeModal.close());
      window.openNativeModal = () => nativeModal.showModal();
      window.closeNativeModal = () => nativeModal.close();
      const closedModalHost = document.createElement('div');
      const closedModalRoot = closedModalHost.attachShadow({ mode: 'closed' });
      const closedNativeModal = document.createElement('dialog');
      closedNativeModal.textContent = 'Closed shadow modal';
      closedModalRoot.append(closedNativeModal);
      document.body.append(closedModalHost);
      window.openClosedNativeModal = () => closedNativeModal.showModal();
      window.closeClosedNativeModal = () => closedNativeModal.close();
      let closedPopoverClicks = 0;
      const closedPopoverHost = document.createElement('div');
      closedPopoverHost.style.cssText = 'position:fixed;left:80px;top:80px;width:120px;height:60px';
      const closedPopoverRoot = closedPopoverHost.attachShadow({ mode: 'closed' });
      const closedPopover = document.createElement('button');
      closedPopover.popover = 'manual';
      closedPopover.textContent = 'Closed popover action';
      closedPopover.style.cssText =
        'position:fixed;inset:80px auto auto 80px;margin:0;width:120px;height:60px;pointer-events:auto';
      closedPopover.addEventListener('click', () => {
        closedPopoverClicks += 1;
      });
      closedPopoverRoot.append(closedPopover);
      document.body.append(closedPopoverHost);
      window.openClosedPopover = () => closedPopover.showPopover();
      window.closeClosedPopover = () => closedPopover.hidePopover();
      window.closedPopoverClicks = () => closedPopoverClicks;
      window.closedPopoverRect = () => {
        const rect = closedPopover.getBoundingClientRect();
        return { x: rect.x, y: rect.y, width: rect.width, height: rect.height };
      };
      window.frameClicks = () => document.getElementById('fixture-frame').contentWindow.clicks || 0;
      window.lockForManualDialog = () => {
        document.body.style.overflow = 'hidden';
        document.getElementById('manual-interruption').setAttribute('role', 'dialog');
      };
      window.addAutomaticPromo = () => {
        const promo = document.createElement('aside');
        promo.id = 'automatic-promo';
        promo.className = 'newsletter-popup';
        promo.textContent = 'Subscribe to our newsletter for weekly updates';
        promo.style.cssText =
          'position:fixed;left:24px;bottom:24px;width:420px;height:100px;padding:20px;background:white';
        document.body.append(promo);
      };
    </script>
  </body>
</html>
