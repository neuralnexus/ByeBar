<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="common.css" />
    <title>Late class activation</title>
  </head>
  <body>
    <aside id="late" class="shell" style="position: fixed; bottom: 0; left: 0; width: 100%; height: 80px">
      Subscribe to our newsletter
    </aside>
    <aside
      id="late-style"
      class="newsletter-popup"
      style="position: fixed; bottom: 0; left: 0; width: 100%; height: 80px; display: none"
    >
      Subscribe to our newsletter
    </aside>
    <aside
      id="post-retry-style"
      class="newsletter-popup"
      style="position: fixed; top: 0; left: 0; width: 100%; height: 80px; display: none"
    >
      Subscribe to our newsletter
    </aside>
    <aside
      id="late-text"
      class="newsletter-popup"
      style="position: fixed; top: 180px; left: 0; width: 600px; height: 80px"
    >
      <span id="late-copy">Welcome back</span>
    </aside>
    <section id="late-cookie" class="cookie-banner">
      We use cookies to protect your privacy. <button id="late-reject" disabled>Reject all</button>
    </section>
    <section id="late-policy" class="shell">
      We use cookies to protect your privacy. <button id="late-class-reject">Reject all</button>
    </section>
    <late-shadow></late-shadow>
    <deferred-shadow></deferred-shadow>
    <div id="standard-shadow"></div>
    <script>
      window.fixtureEvents = { lateReject: 0, lateClassReject: 0 };
      document
        .querySelector('#late-reject')
        .addEventListener('click', () => window.fixtureEvents.lateReject++);
      document
        .querySelector('#late-class-reject')
        .addEventListener('click', () => window.fixtureEvents.lateClassReject++);
      customElements.define(
        'late-shadow',
        class extends HTMLElement {
          connectedCallback() {
            const root = this.attachShadow({ mode: 'open' });
            root.innerHTML = `<aside id="late-shadow" class="shell" style="position:fixed;bottom:90px;left:0;width:600px;height:80px;z-index:50">Subscribe to our newsletter</aside>`;
          }
        }
      );
      window.revealLatePopups = () => {
        document.querySelector('#late').className = 'newsletter-popup';
        document.querySelector('late-shadow').shadowRoot.querySelector('#late-shadow').className =
          'newsletter-popup';
      };
      window.revealStylePopup = () => {
        document.querySelector('#late-style').style.display = 'block';
      };
      window.hydrateLateContent = () => {
        document.querySelector('#late-copy').firstChild.data = 'Subscribe to our newsletter';
        document.querySelector('#late-reject').disabled = false;
        document.querySelector('#late-policy').className = 'cc-window';
      };
      setTimeout(() => {
        customElements.define(
          'deferred-shadow',
          class extends HTMLElement {
            connectedCallback() {
              const root = this.attachShadow({ mode: 'open' });
              root.innerHTML = `<aside id="deferred-promo" class="newsletter-popup" style="position:fixed;top:0;left:0;width:600px;height:80px;z-index:50">Subscribe to our newsletter</aside>`;
            }
          }
        );
      }, 500);
      setTimeout(() => {
        const root = document.querySelector('#standard-shadow').attachShadow({ mode: 'open' });
        root.innerHTML = `<aside id="standard-shadow-promo" class="newsletter-popup" style="position:fixed;top:90px;left:0;width:600px;height:80px;z-index:50">Subscribe to our newsletter</aside>`;
        document.querySelector('#post-retry-style').style.display = 'block';
      }, 8500);
    </script>
  </body>
</html>
