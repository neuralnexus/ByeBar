<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="common.css" />
    <title>Consent safety</title>
    <style>
      .cookie-banner {
        position: fixed;
        right: 0;
        bottom: 0;
        z-index: 250;
        width: 500px;
        min-height: 100px;
        background: white;
      }
    </style>
  </head>
  <body>
    <main>
      <button id="outside" data-testid="cookie-decline">Reject outside banner</button>
      <button id="open-user-cookie">Privacy choices</button>
      <shadow-cookie></shadow-cookie>
    </main>
    <section id="visible-banner" class="cookie-banner">
      We use cookies. <button id="visible-reject" data-testid="cookie-decline">Reject all</button>
      <button id="visible-reject-duplicate" data-testid="cookie-decline">Reject all</button>
      <button id="visible-accept">Accept all</button>
    </section>
    <section id="hidden-banner" class="cookie-banner" style="display: none">
      We use cookies. <button data-testid="cookie-decline">Reject all</button>
    </section>
    <section id="offscreen-banner" class="cookie-banner offscreen">
      We use cookies. <button data-testid="cookie-decline">Reject all</button>
    </section>
    <section id="aria-hidden-banner" class="cookie-banner" aria-hidden="true">
      We use cookies. <button data-testid="cookie-decline">Reject all</button>
    </section>
    <div style="opacity: 0">
      <section id="transparent-banner" class="cookie-banner">
        We use cookies. <button data-testid="cookie-decline">Reject all</button>
      </section>
    </div>
    <script>
      window.fixtureEvents = {
        visibleReject: 0,
        hiddenReject: 0,
        accept: 0,
        outside: 0,
        userOpened: 0,
        shadowUserOpened: 0
      };
      customElements.define(
        'shadow-cookie',
        class extends HTMLElement {
          connectedCallback() {
            const root = this.attachShadow({ mode: 'open' });
            root.innerHTML = `
              <button id="open-shadow-cookie">Shadow privacy choices</button>
              <section id="shadow-policy" class="shell">
                We use cookies. <button data-testid="cookie-decline">Reject all</button>
              </section>
            `;
            root.querySelector('#open-shadow-cookie').addEventListener('click', () => {
              root.querySelector('#shadow-policy').setAttribute('data-cky-tag', 'notice');
            });
            root
              .querySelector('[data-testid="cookie-decline"]')
              .addEventListener('click', () => window.fixtureEvents.shadowUserOpened++);
          }
        }
      );
      document
        .querySelector('#visible-reject')
        .addEventListener('click', () => window.fixtureEvents.visibleReject++);
      document
        .querySelector('#visible-reject-duplicate')
        .addEventListener('click', () => window.fixtureEvents.visibleReject++);
      document
        .querySelector('#visible-accept')
        .addEventListener('click', () => window.fixtureEvents.accept++);
      document.querySelector('#outside').addEventListener('click', () => window.fixtureEvents.outside++);
      document.querySelector('#open-user-cookie').addEventListener('click', () => {
        const banner = document.createElement('section');
        banner.id = 'user-cookie';
        banner.className = 'cookie-banner';
        banner.innerHTML = 'We use cookies. <button data-testid="cookie-decline">Reject all</button>';
        banner.querySelector('button').addEventListener('click', () => window.fixtureEvents.userOpened++);
        document.body.append(banner);
      });
      document
        .querySelectorAll(
          '#hidden-banner button, #offscreen-banner button, #aria-hidden-banner button, #transparent-banner button'
        )
        .forEach((button) => button.addEventListener('click', () => window.fixtureEvents.hiddenReject++));
    </script>
  </body>
</html>
