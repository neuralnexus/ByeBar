<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="common.css" />
    <title>Shadow focus repair</title>
  </head>
  <body>
    <main><button id="outside">Outside control</button></main>
    <slot-promo><input id="email" slot="control" aria-label="Email" /></slot-promo>
    <script>
      customElements.define(
        'slot-promo',
        class extends HTMLElement {
          connectedCallback() {
            const root = this.attachShadow({ mode: 'open' });
            root.innerHTML = `<aside id="shadow-focus-promo" class="newsletter-popup" style="position:fixed;bottom:0;left:0;width:100%;height:100px">Subscribe to our newsletter <slot name="control"></slot></aside>`;
          }
        }
      );
      document.querySelector('#outside').focus();
      document.querySelector('#email').focus();
    </script>
  </body>
</html>
